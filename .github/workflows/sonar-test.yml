name: Sonar Code Quality & Security

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  sonar:
    name: Sonar Scan & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Sonar Configuration
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Sonar Project Key: sonartest"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}
        with:
          args: >
            -Dsonar.projectKey=sonartest
            -Dsonar.projectName=sonartest
            -Dsonar.sources=.

      - name: Sonar Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SONAR TEST PASSED
        run: |
          echo "=============================="
          echo "      SONAR TEST PASSED"
          echo "=============================="
